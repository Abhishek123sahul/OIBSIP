<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Web App | OIBSIP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>My To-Do List</h1>
            <p>Organize your tasks and stay productive.</p>
        </header>

        <!-- Add Task Section -->
        <section class="task-input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="100"
            >

            <button id="addTaskBtn">Add Task</button>

        </section>

        <!-- Task Statistics -->
        <section class="task-stats">

            <div class="stat-box">
                <span id="pendingCount">0</span>
                <p>Pending</p>
            </div>

            <div class="stat-box">
                <span id="completedCount">0</span>
                <p>Completed</p>
            </div>

        </section>

        <!-- Pending Tasks -->
        <section class="task-section">

            <h2>Pending Tasks</h2>

            <div id="pendingTasks" class="task-list">
                <p class="empty-message">
                    No pending tasks. Add a new task to get started!
                </p>
            </div>

        </section>

        <!-- Completed Tasks -->
        <section class="task-section completed-section">

            <h2>Completed Tasks</h2>

            <div id="completedTasks" class="task-list">
                <p class="empty-message">
                    No completed tasks yet.
                </p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
