<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Authentication System | OIBSIP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Authentication Card -->
        <div class="auth-card">

            <div class="brand">
                <h1>Secure Login</h1>
                <p>Login or create your account</p>
            </div>

            <!-- Login Form -->
            <section id="loginSection">

                <h2>Login</h2>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <p id="loginMessage" class="message"></p>

                    <button type="submit" class="primary-btn">
                        Login
                    </button>

                </form>

                <p class="switch-text">
                    Don't have an account?
                    <button type="button" id="showRegisterBtn">
                        Create Account
                    </button>
                </p>

            </section>


            <!-- Registration Form -->
            <section id="registerSection" class="hidden">

                <h2>Create Account</h2>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="registerUsername">Username</label>
                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters and 1 number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                        >
                    </div>

                    <p class="password-info">
                        Password must contain at least 8 characters and 1 number.
                    </p>

                    <p id="registerMessage" class="message"></p>

                    <button type="submit" class="primary-btn">
                        Register
                    </button>

                </form>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" id="showLoginBtn">
                        Back to Login
                    </button>
                </p>

            </section>


            <!-- Dashboard -->
            <section id="dashboardSection" class="hidden">

                <div class="dashboard">

                    <h2>Welcome, <span id="dashboardUsername"></span>!</h2>

                    <p>
                        You have successfully logged in to your account.
                    </p>

                    <div class="dashboard-info">
                        <p>
                            <strong>Email:</strong>
                            <span id="dashboardEmail"></span>
                        </p>

                        <p class="success-text">
                            ✓ Authentication successful
                        </p>
                    </div>

                    <button
                        type="button"
                        id="logoutBtn"
                        class="logout-btn"
                    >
                        Logout
                    </button>

                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
